{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-0 mt-5">
      <div class="card-body p-4">
        <h4 class="card-title mb-4 text-center fw-bold text-primary">Criar conta</h4>

        {% if erro %}
        <div class="alert alert-danger">{{ erro }}</div>
        {% endif %}

        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Nome completo</label>
            <input type="text" name="nome" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" name="senha" class="form-control" required minlength="6">
          </div>
          <div class="mb-4">
            <label class="form-label">Perfil</label>
            <select name="perfil" class="form-select" required>
              <option value="" disabled selected>Selecione...</option>
              <option value="professor">Professor</option>
              <option value="pai">Pai / Responsável</option>
              <option value="aluno">Aluno</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary w-100">Criar conta</button>
        </form>

        <hr class="my-3">
        <p class="text-center text-muted small mb-0">
          Já tem conta? <a href="{{ url_for('login') }}">Entrar</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
