{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-4">Novo comunicado</h5>

        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" name="titulo" class="form-control" required autofocus
                   placeholder="Ex: Reunião de pais – 10/05">
          </div>
          <div class="mb-4">
            <label class="form-label">Conteúdo</label>
            <textarea name="conteudo" class="form-control" rows="6" required
                      placeholder="Escreva o comunicado aqui..."></textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Publicar</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
