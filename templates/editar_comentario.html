{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-1">Editar comentário</h5>
        <p class="text-muted small mb-4">
          Em: <em>{{ comentario.comunicado.titulo }}</em>
        </p>

        <form method="POST">
          <div class="mb-4">
            <label class="form-label">Comentário</label>
            <textarea name="conteudo" class="form-control" rows="4" required autofocus
                      maxlength="500">{{ comentario.conteudo }}</textarea>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Salvar alterações</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">Cancelar</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
